# Score weights for SBA and Google facts. They join the website signals in
# signals.yaml as "fit", so every point stays traceable to evidence.
weights:
  sba_registered: 8          # registered with the SBA, contact shown in public
  established: 10            # in business at least established_years
  established_years: 3
  contacts_own_email: 8      # the email carries the contact person's name
  company_domain: 4          # the email is on the business's own domain
  sba_certified: 6           # 8(a), women-owned, HUBZone or veteran-owned certification
  google_listing: 10         # a Google listing confirmed as this business
  reviews_many: 14           # 50+ Google ratings: a busy, established business
  reviews_some: 7            # 10-49 Google ratings
  good_rating: 5             # 4.0 stars or better, from at least 10 ratings
